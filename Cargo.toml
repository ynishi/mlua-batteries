[workspace]
members = ["crates/mlua-batteries-sqlite", "crates/mlua-batteries-sqlite-isle"]

# Identity shared by every crate in this repo. Members inherit with
# `<field>.workspace = true` rather than restating the values.
[workspace.package]
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura"]
repository = "https://github.com/ynishi/mlua-batteries"
homepage = "https://github.com/ynishi/mlua-batteries"

[package]
name = "mlua-batteries"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Batteries-included standard library modules for mlua"
readme = "README.md"
keywords = ["lua", "mlua", "batteries", "stdlib", "sandbox"]
categories = ["development-tools", "api-bindings"]

[features]
default = ["json", "env", "path", "time", "string", "validate"]
json = ["dep:serde_json"]
env = []
path = []
time = []
string = []
regex = ["dep:regex"]
validate = []
log = ["dep:log"]
uuid = ["dep:uuid"]
base64 = ["dep:base64"]
fs = ["dep:walkdir", "dep:globset"]
http = ["dep:ureq"]
llm = ["http", "json", "dep:secrecy"]
hash = ["dep:sha2"]
schema = ["validate", "dep:schema-bridge"]
sandbox = ["dep:cap-std"]
# Typed argv pipeline spawn (no shell involved). std-only, no extra deps.
proc = []
# Filesystem versioning watcher: content-addressed blob store + JSONL
# journal driven by the `notify` crate.
watch = ["dep:notify", "dep:sha2", "dep:serde_json", "dep:tracing"]
# Async / structured-concurrency primitives. Requires a tokio
# current-thread runtime + LocalSet (mlua-isle's AsyncIsle satisfies this).
task = ["dep:tokio", "dep:tracing", "mlua/async"]
# `std.sql` / `std.kv` moved out in 0.5.0 — they now live in the
# `mlua-batteries-sqlite` crate (crates/mlua-batteries-sqlite in this repo).
# The reason is the SQLite stack, not the code: `libsqlite3-sys` declares
# `links = "sqlite3"`, so a build graph holds exactly one rusqlite cluster and
# cargo enforces that during dependency *resolution* — a crate cannot offer
# several clusters behind mutually exclusive features. Serving more than one
# means publishing more than one version line, and that constraint belongs on
# the small bridge crate rather than on this facade, whose version line stays
# free for its own features.

full = ["json", "env", "path", "time", "string", "regex", "validate", "log", "uuid", "base64", "fs", "http", "llm", "hash", "schema", "sandbox", "proc", "watch", "task"]

[dependencies]
mlua = { version = "0.11", features = ["lua54", "vendored"] }

# Feature-gated
serde_json = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
globset = { version = "0.4", optional = true }
ureq = { version = "3", optional = true }
regex = { version = "1", optional = true }
log = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4", "v7"], optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
notify = { version = "8", optional = true }
secrecy = { version = "0.10", optional = true }
schema-bridge = { version = "0.4.0", features = ["mlua"], optional = true }
cap-std = { version = "4", optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
